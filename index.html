<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearPZzAzZ - Product Tag Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="Image/WearPZzAzZ_logo.png" alt="WearPZzAzZ Logo" width="30" height="30" class="d-inline-block align-top">
                WearPZzAzZ
            </a>
        </div>
    </nav>

    <div class="container">
        <div id="section1" class="card mb-3">
            <div class="card-header">Product Type 1</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="Tag1" id="tag1">
                    <label class="form-check-label" for="tag1">Tag 1</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="Tag2" id="tag2">
                    <label class="form-check-label" for="tag2">Tag 2</label>
                </div>
            </div>
        </div>

        <div id="section2" class="card mb-3">
            <div class="card-header">Product Type 2</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="Tag3" id="tag3">
                    <label class="form-check-label" for="tag3">Tag 3</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="Tag4" id="tag4">
                    <label class="form-check-label" for="tag4">Tag 4</label>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <button class="btn btn-primary" onclick="previousSection()">Previous</button>
            <button class="btn btn-primary" onclick="nextSection()">Next</button>
        </div>

        <div class="mt-4">
            <button class="btn btn-success" onclick="submitSelection()">Submit</button>
            <div id="selectedTags" class="mt-3"></div>
            <button class="btn btn-secondary mt-2" onclick="copyTags()">Copy Tags</button>
        </div>
    </div>

    <script src="JS/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
