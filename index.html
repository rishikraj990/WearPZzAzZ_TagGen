<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearPZzAzZ - Product Tag Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
    
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container ">
            <div class="row align-items-start">
              <div class="col">
                <a class="navbar-brand">
                    <img src="Image/WearPZzAzZ_logo.png" alt="WearPZzAzZ Logo" width="50%" height="50%" class="d-inline-block align-top" href="index.html">
                </a>
              </div>
              <div class="col align-self-center text-center logo_center">
                WearPZzAzZ
              </div>
              <div class="col align-self-center text-center">
                <a class="navbar-brand">
                    <img src="Image/login.png" alt="Loged In" width="15%" height="15%" class="d-inline-block align-top" href="index.html">
                </a>
              </div>
            </div>
          </div>
    </nav>

        <div class="container d-flex justify-content-center">
            <div class="card mb-3 p-3" style="width: 25%;">
                <div id="formContainer"></div>

                <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-primary" id="prevBtn" onclick="previousSection()">Previous</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextSection()">Next</button>
                </div>
            </div>
        </div>

    <div class="container text-center mt-3">
        <button class="btn btn-success d-none" id="submitBtn" onclick="submitSelection()">Submit</button>
        <div id="selectedTags" class="mt-3"></div>
        <button class="btn btn-secondary mt-2 d-none" id="copyTagsBtn" onclick="copyTags()">Copy Tags</button>
    </div>

    <script src="JS/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
